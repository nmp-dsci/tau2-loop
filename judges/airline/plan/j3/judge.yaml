# The plan judge j3 (s11 J3, cycle 2): j1's model, effort and decision rule, with the loop's lessons in judge.md beside it.
name: j3
parent: j1
domain: airline
judge: plan
model: claude-sonnet-5     # s11 Fig 10: a reviewer weaker than the agent at the policy second-guesses right plans
effort: medium
threshold: 0.5             # a block stands when confidence >= this; J3's scorer sets it on the read half
trigger: regex             # tooljudge/labels.py PLAN_TRIGGER, until a reply declares its phase (J5)
structured: true           # the verdict is schema-enforced by the SDK's output_format (the J2 probe held)
fails: open                # an error or an unparsable verdict allows the reply, and the record says so
