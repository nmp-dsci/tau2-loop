# workflow_rag r22 (s41, 1 Nov 2026, the person's call: "do 1 and 2, build r22 and run the gate").
# r21's audit marked every target step of R2 and R3 valid, before the merge and after it. R3: doc
# 032's REQUIRED list names duplicate_charge and its NOT REQUIRED exception reaches it only as a
# "non-fraud dispute"; the library step copies both, so every clause was "stated", and an audit that
# reads clause by clause never tried the one case where they clash. R2: the deposit step's "if the
# customer accepts the record, do not file" passed as a "question" because it asks the customer. r22
# changes the audit only: (1) a step that sets a field from a list of conditions is judged case by
# case, and R3 covers a list and its exceptions in one document; (2) rag_agent.md's rule 15 (no
# choice a document lacks) is reading rule 6, and asking whether to go ahead is a condition, not a
# question. rag_agent.md's rule 24 and merge.md carry the same wording. Built by re-merging only
# r18's 084 session into r21's library (it writes the debit dispute, closing and replacement jobs),
# so its audits re-judge every step of those jobs. The liability tier's statement date is left
# alone: no document says when statements are issued. Frozen: a change is a new rN, never an edit.
name: r22
domain: banking_knowledge
written: 2026-11-01
model: opus          # r4's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole script, never gold
seed: r21                    # r21's library: r22 re-merges r18's 084 session into it (TASKS=task_084)
drafts_from: r18             # s25: no research; r18's sessions' research, drafts and decisions (084)
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled              # unused: a re-merge takes r18's sessions in the order they locked
order_seed: 23
keep_tools: true             # r4's: write turns keep the tools listed, so the prompt cache holds
merge_write: full            # D writes each job in full (the bench ran D on r19's full writes)
merge_base: draft            # the bench runs every option on a draft base (bench.load_option)
merge_mode: audit            # s30 (B, D): the library's version is audited against its documents before the merge
post_audit: true             # s30 (D): after the send-back the auditor reads the merged job and rewrites what is unsupported
stages: {model: opus, effort: high}  # the audits' model; their instructions are audit.md (D2's gap rule, r21's reading rules, r22's case-by-case test)
review_binding: false        # s30 (D): the reviewer is advice in the send-back; the post-audit has the last word
rubric: [D9, D10, D13, D14, D16, D18, D19, D20]  # D's: D19 step ids resolve, D20 every listed write tool is called
tool_docs: true              # s22 r13: tool_description, and each called tool's description in the decide and merge turns
describe_named: true         # s22 r17: those turns describe every tool a job names, the ones it rules out included
tool_errors: true            # s23 r18 (M6): each description lists the error replies the tool can return
reviewer:                    # s23 r18 (M2): reads the clauses code picks, in its own context, review.md
  model: opus
  effort: medium
