# workflow_rag r18 (s23, 13 Oct 2026, the person's calls Q1–Q7 on .lavish/s23_v23-failure-diagnosis.html):
# r17 plus reading rules 14–20 (W1–W7 from v23's train failures, every clause its own source, and
# account for what you read) and four checks: a reviewer reads the clauses code picks, kept steps
# included (D14, M1–M3); every document printed in full is cited or set aside (D15, M4); a tool's
# description that names a document's title is followed (D16, M5); and each tool's description
# lists its error replies (M6). D14–D16 go back to the writer once with the gate's reasons and
# are recorded, never blocking.
# Seeded with r17, the latest library. Researches v23's 7 train failures behind W1–W7, then the 10
# failed test questions whose workflows no train failure reaches (R, the person's note).
# Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r18
domain: banking_knowledge
written: 2026-10-13
model: opus          # r4's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole script, never gold
seed: r17                    # the library starts as r17's, the latest
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled
order_seed: 23
keep_tools: true             # r4's: write turns keep the tools listed, so the prompt cache holds
merge_write: edits           # r4's: a merge into one library job may be written as edits
rubric: [D9, D10, D12, D13, D14, D15, D16]  # s23: D14–D16 are sent back once and recorded
tool_docs: true              # s22 r13: tool_description, and each called tool's description in the decide and merge turns
describe_named: true         # s22 r17: those turns describe every tool a job names, the ones it rules out included
tool_errors: true            # s23 r18 (M6): each description lists the error replies the tool can return
reviewer:                    # s23 r18 (M2): reads the clauses code picks, in its own context, review.md
  model: opus
  effort: medium
