# workflow_rag r21 (s41, 29 Oct 2026, the person's calls on .lavish/s41_workflow-rag-stage2-plan.html:
# v32 on v31, re-merge r18's sessions, the shared jobs only, all five rules). s40's stage 1 (v31, the
# answering agent alone) showed a prompt rule loses to a workflow step that says otherwise, so stage 2
# changes the library. Five general reading rules, each learned from a train failure whose agent
# followed a library step, go into the audit (audit.md), the merge (merge.md) and the research and
# merge turns (rag_agent.md): R1 a field takes a value its document lists (rule 22), R2 a condition
# comes from the step's own passage and the records (rule 23), R3 the passage that names the case
# decides (rule 24), R4 rule 21 binding where a document says how the system rounds, R5 a fee does
# not make a requirement optional (rule 16). r20's audit had the last word and knew none of them, so
# steps rag_agent.md's rules 14, 16 and 21 forbid stood. Like r20, r21 runs no research: it re-merges
# into r20's library the r18 sessions of the 4 train questions whose failures name a library step
# (`make rag-remerge RAG=r21 TASKS=...`), 10 merges into 7 jobs, and its audits re-judge every step
# of those jobs. Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r21
domain: banking_knowledge
written: 2026-10-29
model: opus          # r4's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole script, never gold
seed: r20                    # r20's library: r21 re-merges 4 of r18's sessions into it (TASKS=)
drafts_from: r18             # s25: no research; r18's sessions' research, drafts and decisions (027, 063, 084, 086)
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled              # unused: a re-merge takes r18's sessions in the order they locked
order_seed: 23
keep_tools: true             # r4's: write turns keep the tools listed, so the prompt cache holds
merge_write: full            # D writes each job in full (the bench ran D on r19's full writes)
merge_base: draft            # the bench runs every option on a draft base (bench.load_option)
merge_mode: audit            # s30 (B, D): the library's version is audited against its documents before the merge
post_audit: true             # s30 (D): after the send-back the auditor reads the merged job and rewrites what is unsupported
stages: {model: opus, effort: high}  # the audits' model; their instructions are audit.md (D2's gap rule, r21's five reading rules)
review_binding: false        # s30 (D): the reviewer is advice in the send-back; the post-audit has the last word
rubric: [D9, D10, D13, D14, D16, D18, D19, D20]  # D's: D19 step ids resolve, D20 every listed write tool is called
tool_docs: true              # s22 r13: tool_description, and each called tool's description in the decide and merge turns
describe_named: true         # s22 r17: those turns describe every tool a job names, the ones it rules out included
tool_errors: true            # s23 r18 (M6): each description lists the error replies the tool can return
reviewer:                    # s23 r18 (M2): reads the clauses code picks, in its own context, review.md
  model: opus
  effort: medium
