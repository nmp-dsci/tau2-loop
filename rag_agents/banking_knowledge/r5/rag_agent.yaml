# workflow_rag r5 (s22, 9 Oct 2026, the person's call): the first step of a defect-by-defect
# optimisation of workflow_rag (one version per change, each seeded with the last). r5 = r4 plus D1's
# change: research rule 1 (trace each write's requirements and chain the documented procedure that
# meets one) and rubric D10 (a write's documented status requirement is met by the documents' tool,
# parsed from their requirement and step sections; workflows/toolspec.py). No rule names a case.
# Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r5
domain: banking_knowledge
written: 2026-10-09
model: opus          # r4's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole script, never gold
seed: r3                     # the library starts as r3's: every train and test question's workflows
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled
order_seed: 22
keep_tools: true             # r4's: write turns keep the tools listed, so the prompt cache holds
merge_write: edits           # r4's: a merge into one library job may be written as edits
rubric: [D10]                # s22 D1: the merge gate adds D10 to D8 and D1 (workflows/toolspec.py)
