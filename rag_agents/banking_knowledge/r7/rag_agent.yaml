# workflow_rag r7 (s22, 9 Oct 2026, the person's call): D2 again, with merges that update.
# r7 = r6 plus a merge that re-reads every step and rule of the version it merges: kept (named in
# `kept`, its quote saying it as written), rewritten (the documents say it differently, or the
# draft reads the passage better under the reading rules) or removed (no document supports it).
# r6's edit merges kept every step they did not name, so its draft's reading of doc 032 never
# reached the library. Rubric D12 sends back a merge that leaves an old step untouched without
# naming it in `kept`. Seeded with r6, so D1's and D2's merges stay.
# Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r7
domain: banking_knowledge
written: 2026-10-09
model: opus          # r4's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole script, never gold
seed: r6                     # the library starts as r6's: r3's plus D1's and D2's merges
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled
order_seed: 22
keep_tools: true             # r4's: write turns keep the tools listed, so the prompt cache holds
merge_write: edits           # r4's: a merge into one library job may be written as edits
rubric: [D9, D10, D12]       # s22: the merge gate adds D9, D10 and D12 to D8 and D1
