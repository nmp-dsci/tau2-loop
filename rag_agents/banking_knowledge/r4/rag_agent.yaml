# workflow_rag r4 (8 Oct 2026, the person's call): r3 at less cost. A turn that must write keeps the
# tools listed, so the prompt cache reads the conversation back (r3's decide turns read 3% from it),
# and a merge into one library job may be written as edits on its newest version, not in full (61%
# of r3's merge output was workflows copied back). Same research, decide turn, locks and rubric.
# Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r4
domain: banking_knowledge
written: 2026-10-08
model: opus          # r3's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole train script, never gold
seed: r3                     # the library starts as r3's, which holds r2's and r3's 60 train questions
queue: after_seed            # questions r3's library already merged are not researched again
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled
order_seed: 21
keep_tools: true             # the decide and write-now turns keep the tools listed; a call is refused
merge_write: edits           # a merge into one library job may be written as edits (merge.md)
