# workflow_rag r19 (s25, 15 Oct 2026, the person's calls on .lavish/s25_v26-failures-r19-v27-plan.html):
# a better merge on the same research. r18's merges kept the old library: 12 of its 46 never went
# in (9 for "lost quotes the changelog does not name"), and the ones that did kept 26 of 32 clauses
# the reviewer rejected, while r18's own drafts held the fix (090's period, 084's cap). r19 runs no
# research: each r18 session's research is replayed from its events, its draft and decision are
# reused, and only the merge runs again, so r19 against r18 shows the merge alone. The draft is the
# base (M1); an old step is carried only when it covers a case the draft does not, its quote is
# found and the reviewer agrees (M2); what is left out is logged by code, never a rejection (M3); a
# step the reviewer still finds unsupported after the send-back is removed (R1). Rule 14 loses
# "never the lesser" (R3), rule 21 says a rounding gap is not a discrepancy (R4), and D18 asks a
# named period for its bounds (R5). If v27 (reading r19) beats v26, this is the merge from r20 on.
# Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r19
domain: banking_knowledge
written: 2026-10-15
model: opus          # r4's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole script, never gold
seed: r17                    # r18's seed: r19 merges r18's drafts into the library r18 started from
drafts_from: r18             # s25: no research; r18's sessions' research, drafts and decisions
merge: concurrent            # r3's: several workers; each locks the jobs it writes
merge_steps: 12
workers: 4
order: shuffled              # unused: a re-merge takes r18's sessions in the order they locked
order_seed: 23
keep_tools: true             # r4's: write turns keep the tools listed, so the prompt cache holds
merge_write: full            # s25 (M1): the job is written again from the draft, never edits on the old version
merge_base: draft            # s25 (M1-M3): the draft is the base; what is left out is logged by code
review_binding: true         # s25 (R1): a step the reviewer still finds unsupported after the send-back is removed
rubric: [D9, D10, D13, D14, D15, D16, D18]  # D12 dropped: a draft-based merge does not account for the old version
tool_docs: true              # s22 r13: tool_description, and each called tool's description in the decide and merge turns
describe_named: true         # s22 r17: those turns describe every tool a job names, the ones it rules out included
tool_errors: true            # s23 r18 (M6): each description lists the error replies the tool can return
reviewer:                    # s23 r18 (M2): reads the clauses code picks, in its own context, review.md
  model: opus
  effort: medium
