# workflow_rag r3 (s21): r2 built by several workers at once. Research takes no lock; a decide
# turn names the jobs it will write, the store holds them while it merges their newest versions.
# Frozen like an answering agent's agent.yaml: a change is a new rN, never an edit.
name: r3
domain: banking_knowledge
written: 2026-10-07
model: opus          # r2's
effort: high
retrieval: alltools_minilm   # the answering agent's (v4's) knowledge tools: BM25, dense, shell
tool_mode: native_parallel   # every tool call of a reply runs, as v4's do
max_steps: 30                # research turns before the agent is told to write what it has
result_chars: 20000          # a tool result longer than this is cut, and says so
input: script                # what it reads: the customer's whole train script, never gold
seed: r2                     # the library starts as r2's when it was paused (s21 Q5): 34 questions merged
queue: after_seed            # the questions r2 already merged are kept, never researched again
merge: concurrent            # several workers; each locks the jobs it writes (s21 Q1, design D)
merge_steps: 12              # turns for the merge, research of the current versions included
workers: 4                   # s21 Q2
order: shuffled              # s21 Q3: ids come in topic runs, so id order puts collisions together
order_seed: 21
