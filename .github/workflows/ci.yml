name: CI

on:
  push:
    branches: [main, tau2-loop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    # No ANTHROPIC_API_KEY and no CLI login here, deliberately: every test is
    # offline, and `require_live()` is what keeps a model call out of CI.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run ruff check --no-fix src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  gate:
    name: Eval gate — every champion re-scores offline to its registry entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run tau2loop gate

  frontend:
    name: Frontend — types, design lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:design
      - run: npm run build
