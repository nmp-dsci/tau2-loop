# The optimiser profile of airline (s13 §5), read before every cycle by
# src/tau2_loop/loop/profiles.py. Every value is today's default: the one optimiser all four
# datasets shared before profiles, so this dataset's optimiser prompts are byte for byte what
# they were. Change a value to tune this dataset's optimiser alone. Its lessons go in guide.md
# beside this file (empty: none), its extra checks in an optional guards.py. OPTIMISER= and
# MODE= on make loop still override model and mode for one run, and every cycle records this
# folder's fingerprint in the ledger.
model: opus # the optimiser sessions' model (claude-opus-5-5)
effort: medium # low, medium, high, xhigh or max
mode: classic # classic: one session edits system.md and helper.py; routing: diagnose, then write
max_turns: 120 # each session's turn limit
# what the failures section may spend, in characters, shared out per failure (at least 1,000 each)
transcript_budget: 60000 # condensed transcripts, each also capped at 9,000
scenario_budget: 60000 # each task's goal and notes
diff_budget: 90000 # what tau2 graded: the database difference and the actions against the calls
# what each mode may edit: classic writes these; a routing diagnosis routes among these
surfaces:
  classic: [system.md, helper.py]
  routing: [system.md, helper.py, checks.py, memory.py, guidance.py]
