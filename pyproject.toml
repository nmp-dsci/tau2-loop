[project]
name = "tau2-loop"
version = "0.1.0"
description = "A policy-following agent on τ²-bench, run on the Claude subscription, with a scored, versioned, self-improving eval loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  # τ³-bench v1.0.1, pinned at 2174a60 as a submodule: the harness, domains, evaluator and data.
  "tau2",
  "claude-agent-sdk>=0.2.152",
  "litellm>=1.80.15,<1.82.7",
  "pydantic>=2.9",
  "typer>=0.15",
  "rich>=13.9",
  "mlflow>=3.12,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2",
  # the central Postgres (nmp-central-ai, database `tau2`): app state only, never a benchmark fact
  "psycopg[binary]>=3.2",
]

[project.scripts]
tau2loop = "tau2_loop.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.14.2",
  "mypy>=1.13",
  "types-PyYAML",
]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau2_loop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tau2_loop"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tau2.*", "mlflow.*", "claude_agent_sdk.*", "litellm.*", "loguru.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -p no:warnings"
