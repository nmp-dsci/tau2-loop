<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tau2-loop">
  <!-- Field Guide tokens, literal because a favicon cannot read CSS variables: bg #F7F6F2, ink #1A1D1B, accent #0A6552 -->
  <rect width="64" height="64" rx="12" fill="#F7F6F2"/>
  <!-- τ: crossbar and a stem that hooks right at the foot -->
  <path d="M10 24h26" fill="none" stroke="#1A1D1B" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M24 24v18a6 6 0 0 0 10 4.5" fill="none" stroke="#1A1D1B" stroke-width="6.5" stroke-linecap="round"/>
  <!-- ²: the superscript, in the accent, drawn as a stroke so it reads at 16px -->
  <path d="M41 17a6 6 0 1 1 10.5 4L41 30h12" fill="none" stroke="#0A6552" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
