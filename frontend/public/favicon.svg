<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tau2-loop">
  <!-- Field Guide tokens, literal because a favicon cannot read CSS variables: bg #F7F6F2, ink #1A1D1B, accent #0A6552 -->
  <rect width="64" height="64" rx="12" fill="#F7F6F2"/>
  <!-- τ: the crossbar and a stem that hooks back -->
  <path d="M12 22h28" fill="none" stroke="#1A1D1B" stroke-width="6" stroke-linecap="round"/>
  <path d="M26 22v18a6 6 0 0 0 10 4" fill="none" stroke="#1A1D1B" stroke-width="6" stroke-linecap="round"/>
  <!-- the loop: an open ring that comes back to the gate's dot, sitting where the ² would -->
  <path d="M50 24a9 9 0 1 0 5.5 6" fill="none" stroke="#0A6552" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="24" r="4" fill="#0A6552"/>
</svg>
