# s31 option D-lean: D (audit, merge, audit) at less cost, the person's calls O1-O5 on
# .lavish/s31_merge-bench-token-use.html (21 Oct 2026; O6 and O7 not taken). D's write turns were
# half the bench's weighted cost: each merge wrote the whole debit job, about 120,000 characters,
# twice. The same audits and post-audit as D, the same reviewer and rubric; what changes is what
# the merge writes and sees:
#   O1 merge_write: edits   the merge writes edits on the audited version, which code applies
#   O2 send_back: failed    the send-back lists what failed and the steps it names, answered with
#                           edits on the job as it then stands
#   O3 held_only            only the job the merge holds is written; any other is dropped unread
#   O4 merge_steps: 0       no searching in the merge turn or the send-back (the tools stay listed,
#                           so the prompt cache holds, and a call is refused)
#   O5 review_once          the reviewer reads the first reply only; the auditor reads the last
# O1 and O4 change what the merge decides, so its first trial is checked against D trial 1 and B
# trial 1 before it is trusted (s31 §05).
base: r19
merge_mode: audit
post_audit: true
review_binding: false
merge_write: edits
send_back: failed
held_only: true
merge_steps: 0
review_once: true
stages: {model: opus, effort: high}
rubric: [D9, D10, D13, D14, D16, D18, D19, D20]
