# s30 option B, "audit the old version, then merge": an auditor in its own context, with no draft
# and no research, reads the library's version with the full text of every document it cites and
# marks each step valid, rewrite or invalid (audit.md). The merge turn, in the research
# conversation, reads the audited version: invalid steps are gone, a valid or rewritten step leaves
# only with an account (as in A), a conflict is settled by the passage, and the job is rewritten in
# the procedure's order (merge.md). The reviewer's "no" does not remove a valid step kept as the
# audit left it.
base: r19
merge_mode: audit
stages: {model: opus, effort: high}
rubric: [D9, D10, D13, D14, D16, D18, D19, D20]
