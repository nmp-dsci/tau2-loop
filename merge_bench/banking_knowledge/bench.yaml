# The merge bench (s30, 20 Oct 2026, the person's call on .lavish/s30_workflow-merge-opt-plan.html:
# D1 the debit dispute job, D2 options A, B and C, D3 an answer key, D4 one trial each then a
# second for the best two, D5 runs under merge_runs/, outside the rN line).
#
# A bench run replays one library job's merges with no research: each source session's research
# conversation is rebuilt from its events, its draft is cut to the drafted job that names this job,
# its decision is reused, and only the merge runs, on a scratch library seeded like `seed`. The
# merges run one after another in `order`, each reading the head the last one wrote. Every option
# merges the same drafts into the same head, so a difference between options is the merge's alone.
#
# Frozen like an rN: a change to an option is a new option folder, never an edit after it has run.
domain: banking_knowledge
jobs:
  filing_a_debit_card_transaction_dispute:
    seed: r19          # r19's pinned seed.json: r17's library, this job at r8 task_084's version
    drafts_from: r18   # the sessions whose research and drafts are replayed
    order: [task_084, task_088, task_090, task_086]   # r18's lock order (r19 kept it)
    sessions:
      task_084: 20261013T052114Z_banking_knowledge_r18_task_084
      task_088: 20261013T052114Z_banking_knowledge_r18_task_088
      task_090: 20261013T054609Z_banking_knowledge_r18_task_090
      task_086: 20261013T055032Z_banking_knowledge_r18_task_086
    system_from: 20261015T115836Z_banking_knowledge_r19_task_088   # r19's system.md, the same in all 17 r19 sessions
grader:              # the eval's calls (merge_eval.py): E1 one per version, E3 one per final head
  model: opus
  effort: high
