# s30 option D, "audit, merge, audit" (B combined with C's verification, the person asked whether the
# options combine): B as it is (the library's version audited against its whole documents, then
# the merge turn with valid steps protected), and after the one send-back the same auditor reads
# the merged job in place of the reviewer's binding removal: what the documents do not support is
# rewritten, not removed; a step the job needs to pass D9, D10, D13 or D20 is never removed
# (`merge_opts.post_audit`). Trial 1 showed the binding reviewer remove the filing step over one
# clause (A 086, C 084 and 088), as it did in r19 086. The reviewer still reads the steps code
# picks, as advice in the send-back.
base: r19
merge_mode: audit
post_audit: true
review_binding: false
stages: {model: opus, effort: high}
rubric: [D9, D10, D13, D14, D16, D18, D19, D20]
