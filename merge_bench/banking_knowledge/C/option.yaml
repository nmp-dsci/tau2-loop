# s30 option C, "claim ledger, then rewrite": no merge turn in the research conversation. Both the
# library's version and the draft are broken into claims (extract.md); code groups them by case and
# field and flags a slot with two values; a verifier with the full documents marks each claim
# stated, derived, a question or unsupported and settles each flagged slot by its passage
# (verify.md); a writer writes the job from scratch from the claims that survive (write.md); code
# checks every survivor is in the job and no rejected claim is. Three fresh contexts per job.
base: r19
merge_mode: ledger
stages: {model: opus, effort: high}
rubric: [D9, D10, D13, D14, D16, D18, D19, D20]
